# Workspace root — operator kernel (Rust only at repo root).
[workspace]
members = [
    "crates/ensembly-paths",
    "crates/ensembly-kernel",
    "crates/ensembly-opportunity-finder",
    "crates/ensembly-memory",
    "crates/ensembly-agents",
    "crates/ensembly-schema",
    "crates/evalbench-core",
    "crates/evalbench-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.0"
