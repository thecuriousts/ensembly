# Workspace root — kernel (control) + world (sim) + Operator CLI (Node `src/*`).
[workspace]
members = [
    "crates/peram-core",
    "crates/peram-kernel",
    "crates/peram-memory",
    "crates/peram-agents",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.0"
