name: retrieval-bench

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_100k:
        description: "Also run 100k corpus (slow)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: retrieval-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: test retrieval-bench crate
        run: cargo test --locked -p retrieval-bench
      - name: run benchmark 1k and 10k
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          sizes=1000,10000
          if [ "${{ inputs.run_100k }}" = "true" ] || [ "${RETRIEVAL_BENCH_100K:-}" = "1" ]; then
            sizes="${sizes},100000"
          fi
          cargo run --locked --release -p retrieval-bench -- --sizes "$sizes" --out target/retrieval-bench --git-sha "$GITHUB_SHA"
      - name: upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retrieval-bench-${{ github.sha }}
          path: target/retrieval-bench/
          if-no-files-found: error