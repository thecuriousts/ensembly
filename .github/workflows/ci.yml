name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2

      - name: Test live crates
        run: |
          cargo test --locked -p ensembly-memory
          cargo test --locked -p ensembly-kernel
          cargo test --locked -p ensembly-agents

      - name: Build agent wire binary
        run: cargo build --locked -p ensembly-agents --bin ensembly-mcp
