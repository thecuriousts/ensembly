name: scoreboard

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: scoreboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: unit tests
        run: python3 -m unittest discover -s scripts/scoreboard/test -v
