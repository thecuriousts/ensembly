[package]
name = "evalbench-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "evalbench CLI: hash, check, score, record, run, export"
publish = false

[[bin]]
name = "evalbench"
path = "src/main.rs"

[dependencies]
evalbench-core = { path = "../evalbench-core" }
ensembly-kernel = { path = "../ensembly-kernel" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
