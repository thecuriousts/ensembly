[package]
name = "retrieval-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Slice 1a: deterministic retrieval benchmark (measure only)"
publish = false

[[bin]]
name = "retrieval-bench"
path = "src/main.rs"

[dependencies]
ensembly-kernel = { path = "../ensembly-kernel" }
ensembly-schema = { path = "../ensembly-schema" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"