[package]
name = "ensembly-schema"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Versioned record, decision, pulse, and pack types for the operator kernel"
publish = false

[features]
default = []
opportunity-finder = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
libc = "0.2"
ulid = { version = "1", features = ["serde"] }
[dev-dependencies]
schemars = "0.8"

[[test]]
name = "apps_record"
path = "tests/apps_record.rs"
required-features = ["opportunity-finder"]
