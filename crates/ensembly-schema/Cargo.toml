[package]
name = "ensembly-schema"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure data types for ledger rows and company audits"
publish = false
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
[dev-dependencies]
schemars = "0.8"
