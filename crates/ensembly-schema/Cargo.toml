[package]
name = "ensembly-schema"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Versioned record, decision, pulse, and pack types for the operator kernel"
publish = false

[features]
default = []
opportunity-finder = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
libc = "0.2"
ulid = { version = "1", features = ["serde"] }
[dev-dependencies]
schemars = "0.8"
ulid = { version = "1", features = ["serde"] }

[[test]]
name = "record_v1_read"
path = "tests/record_v1_read.rs"

[[test]]
name = "record_golden"
path = "tests/record_golden.rs"

[[test]]
name = "record_scale"
path = "tests/record_scale.rs"

[[test]]
name = "apps_record"
path = "tests/apps_record.rs"
required-features = ["opportunity-finder"]
