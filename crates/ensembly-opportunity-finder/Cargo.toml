[package]
name = "ensembly-opportunity-finder"
version = "0.1.0"
edition = "2021"
description = "Optional opportunity-finder pack — application ledger, company audit, tracker exports"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
anyhow = "1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
ensembly-schema = { path = "../ensembly-schema", features = ["opportunity-finder"] }

[dev-dependencies]
tempfile = "3"
