[package]
name = "ensembly-memory"
version = "0.1.0"
edition = "2021"
description = "ensembly episodic memory — CRDT trajectory/skills/goals + coherence engine (learning layer; kernel stays control SoT)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
