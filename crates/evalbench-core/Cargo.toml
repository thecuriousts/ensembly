[package]
name = "evalbench-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "evalbench E1: gap check, frozen synthetic task set, trace rows, first-pass score"
publish = false

[features]
# Turns on the deliberately broken Kani harnesses (they must FAIL).
broken-proof-check = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
