[package]
name = "ensembly-kernel"
version = "0.5.1"
edition = "2021"
description = "ensembly operator kernel — S+G+CP, MsgBus, HITL/HOOTL runtime, privacy, turn, durable store, episodic memory bridge"
license = "MIT"
default-run = "ensembly"

[[bin]]
name = "ensembly"
path = "src/main.rs"

# One-release compat alias (same source; cargo warns, harmless). Prefer `ensembly`.
[[bin]]
name = "peram"
path = "src/main.rs"

[features]
default = []
opportunity-finder = ["dep:ensembly-opportunity-finder"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"
ensembly-memory = { path = "../ensembly-memory" }
ensembly-agents = { path = "../ensembly-agents" }
ensembly-schema = { path = "../ensembly-schema" }
ensembly-opportunity-finder = { path = "../ensembly-opportunity-finder", optional = true }
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3"
ensembly-schema = { path = "../ensembly-schema" }

[[test]]
name = "single_writer_ledger"
required-features = ["opportunity-finder"]

[[test]]
name = "tracker_golden"
required-features = ["opportunity-finder"]

[[test]]
name = "apps_record_cli"
required-features = ["opportunity-finder"]

[[test]]
name = "opportunity_cli_golden"
path = "tests/opportunity_cli_golden.rs"
required-features = ["opportunity-finder"]
