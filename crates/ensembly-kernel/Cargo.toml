[package]
name = "ensembly-kernel"
version = "0.5.1"
edition = "2021"
description = "ensembly operator kernel — S+G+CP, MsgBus, HITL/HOOTL runtime, privacy, turn, durable store, episodic memory bridge"
license = "MIT"
default-run = "ensembly"

[[bin]]
name = "ensembly"
path = "src/main.rs"

# One-release compat alias (same source; cargo warns, harmless). Prefer `ensembly`.
[[bin]]
name = "peram"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"
ensembly-memory = { path = "../ensembly-memory" }
ensembly-agents = { path = "../ensembly-agents" }

[dev-dependencies]
tempfile = "3"
