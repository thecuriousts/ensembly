[package]
name = "ensembly-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable plain-text export/restore bundles for ensembly"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
toml = "0.8"
walkdir = "2"
glob = "0.3"
ensembly-paths = { path = "../ensembly-paths" }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
hex = "0.4"