[package]
name = "ensembly-agents"
version = "0.1.0"
edition = "2021"
description = "ensembly agent satellites — InferenceProvider, sync MCP server, Grok ACP registration helpers (aux; kernel stays control SoT)"
license = "MIT"
default-run = "ensembly-mcp"

[[bin]]
name = "ensembly-mcp"
path = "src/bin/ensembly_mcp.rs"

# One-release compat alias (same source; cargo warns, harmless). Prefer `ensembly-mcp`.
[[bin]]
name = "peram-mcp"
path = "src/bin/ensembly_mcp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
ensembly-memory = { path = "../ensembly-memory" }

[dev-dependencies]
tempfile = "3"
